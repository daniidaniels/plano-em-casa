<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Plano em Casa · Una &amp; Dani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sat:var(--safe-area-inset-top,env(safe-area-inset-top));--sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom));
  --bg:#000; --tx:#fff; --sec:rgba(235,235,245,.62); --ter:rgba(235,235,245,.32); --sep:rgba(84,84,88,.5);
  --fill:rgba(120,120,128,.22); --fill2:rgba(120,120,128,.14);
  --glass:rgba(28,28,32,.52); --glassB:rgba(255,255,255,.12);
  --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A; --pink:#FF375F; --teal:#64D2FF; --purple:#BF5AF2; --yellow:#FFD60A;
  --move:#FA114F; --ex:#A6FF00; --stand:#00E0FF;
  --acc:#0A84FF; --acc2:#5E5CE6; --accS:rgba(10,132,255,.18);
  --spring:cubic-bezier(.34,1.56,.64,1); --ease:cubic-bezier(.2,.8,.2,1);
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
}
body.p-una{--acc:#FF6B8B; --acc2:#FF9F0A; --accS:rgba(255,107,139,.18)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--tx);font-family:var(--sf);font-size:16px;line-height:1.38;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;letter-spacing:-.01em}
body{min-height:100vh;padding-bottom:calc(110px + var(--sab));overflow-x:hidden}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
input,select,textarea{font:inherit;color:var(--tx);background:var(--fill2);border:0;border-radius:12px;padding:12px 14px;width:100%;font-size:17px;-webkit-appearance:none;appearance:none}
input::placeholder{color:var(--ter)}
input:focus{outline:2px solid var(--acc);outline-offset:-2px}
input[type=time],input[type=date]{min-height:46px}
.wrap{max-width:600px;margin:0 auto;padding:0 18px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* fundo vivo */
#bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#000}
#bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 22s var(--ease) infinite alternate}
#bg i:nth-child(1){width:60vmax;height:60vmax;left:-20vmax;top:-22vmax;background:radial-gradient(circle,var(--acc),transparent 65%)}
#bg i:nth-child(2){width:50vmax;height:50vmax;right:-22vmax;top:18vh;background:radial-gradient(circle,var(--acc2),transparent 65%);animation-duration:28s;opacity:.35}
#bg i:nth-child(3){width:55vmax;height:55vmax;left:-10vmax;bottom:-30vmax;background:radial-gradient(circle,#30D158,transparent 65%);animation-duration:34s;opacity:.22}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.12)}}

/* vidro */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:.5px solid var(--glassB);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 10px 40px rgba(0,0,0,.35)}
.card{border-radius:24px;padding:18px;margin-bottom:14px}
.card.tight{padding:6px 0}
.card.hero{background:linear-gradient(145deg,color-mix(in srgb,var(--acc) 38%,transparent),color-mix(in srgb,var(--acc2) 18%,transparent) 70%),var(--glass)}

/* barra superior */
#top{position:fixed;top:0;left:0;right:0;z-index:30;padding-top:var(--sat);transition:background .3s,border-color .3s}
#top .wrap{display:flex;align-items:center;justify-content:space-between;height:54px;gap:12px}
#top.sc{background:rgba(18,18,20,.62);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-bottom:.5px solid var(--sep)}
#ttl{font-weight:600;font-size:17px;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .35s var(--spring)}
#top.sc #ttl{opacity:1;transform:none}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;background:var(--fill);border-radius:10px;padding:2px;min-width:150px}
.seg .knob{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);border-radius:8px;background:rgba(99,99,102,.9);box-shadow:0 3px 8px rgba(0,0,0,.25);transition:transform .45s var(--spring)}
.seg.r .knob{transform:translateX(100%)}
.seg button{position:relative;z-index:1;padding:6px 12px;font-size:14px;font-weight:600}
.seg.in{width:100%;margin:0 0 16px}
.seg.in.c3{grid-template-columns:repeat(3,1fr)}
.seg.in.c3 .knob{width:calc(33.33% - 1.4px)}
.seg.in.c3.p1 .knob{transform:translateX(100%)}
.seg.in.c3.p2 .knob{transform:translateX(200%)}

/* tab bar flutuante */
#tabs{position:fixed;left:0;right:0;bottom:calc(14px + var(--sab));z-index:30;display:flex;justify-content:center;pointer-events:none}
.tb{pointer-events:auto;position:relative;display:grid;grid-template-columns:repeat(5,1fr);width:min(94vw,460px);height:66px;border-radius:999px;padding:6px;background:rgba(30,30,34,.58)}
.tb .ind{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px)/5);border-radius:999px;background:rgba(255,255,255,.12);transform:translateX(calc(var(--i,0)*100%));transition:transform .55s var(--spring)}
.tb button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--sec);transition:color .25s,transform .35s var(--spring)}
.tb button svg{width:24px;height:24px;transition:transform .45s var(--spring)}
.tb button.on{color:var(--acc)}
.tb button.on svg{transform:scale(1.08)}
.tb button:active{transform:scale(.9)}

main{padding:calc(62px + var(--sat)) 0 24px}
/* entrada da tela */
main.enter .wrap>*{animation:up .6s var(--ease) both}
main.enter .wrap>*:nth-child(2){animation-delay:.04s}main.enter .wrap>*:nth-child(3){animation-delay:.08s}main.enter .wrap>*:nth-child(4){animation-delay:.12s}main.enter .wrap>*:nth-child(5){animation-delay:.16s}main.enter .wrap>*:nth-child(6){animation-delay:.2s}main.enter .wrap>*:nth-child(7){animation-delay:.24s}main.enter .wrap>*:nth-child(n+8){animation-delay:.28s}
@keyframes up{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}

/* tipografia expressiva */
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.02em;color:var(--acc);text-transform:uppercase}
.lt{font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.035em;margin:4px 0 6px}
.lt .g,.big .g{background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--sec);font-size:15px}
.small{font-size:13px;color:var(--sec)}
.big{font-size:56px;font-weight:900;letter-spacing:-.05em;line-height:1}
.h2{font-size:22px;font-weight:800;letter-spacing:-.025em;margin:28px 0 12px;display:flex;align-items:center;justify-content:space-between}
.h2 a,.h2 button{font-size:15px;font-weight:600;color:var(--acc);letter-spacing:0}
.h3{font-size:17px;font-weight:700;letter-spacing:-.02em}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:600;font-size:16px;background:var(--fill);transition:transform .4s var(--spring),background .2s,opacity .2s}
.btn:active{transform:scale(.94)}
.btn.pri{background:var(--acc);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--acc) 40%,transparent)}
.btn.tint{background:var(--accS);color:var(--acc)}
.btn.sm{padding:8px 13px;font-size:14px;border-radius:999px;white-space:nowrap}
.btn.xs{padding:6px 10px;font-size:13px;border-radius:999px}
.btn.block{width:100%}
.btn.cap{border-radius:999px}
.btn.icon{width:38px;height:38px;padding:0;border-radius:50%}
.btn.danger{color:var(--red)}
.link{color:var(--acc);font-weight:600}

/* listas iOS */
.list{border-radius:22px;overflow:hidden;margin-bottom:14px}
.rw{position:relative;display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:52px;width:100%;text-align:left}
.rw+.rw::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.rw.ind+.rw.ind::before{left:66px}
.rw .lbl{flex:1;min-width:0}
.rw .val{color:var(--sec);font-variant-numeric:tabular-nums;text-align:right}
.rw .chev{color:var(--ter);font-size:20px;margin-left:-4px}
button.rw:active{background:rgba(255,255,255,.06)}
.ic{flex:0 0 34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff}
.ic svg{width:20px;height:20px}

/* switch iOS */
.sw{flex:0 0 51px;height:31px;border-radius:99px;background:var(--fill);position:relative;transition:background .3s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.2),0 1px 1px rgba(0,0,0,.1);transition:transform .4s var(--spring)}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}
.sw.pop::after{animation:swp .45s var(--spring)}
@keyframes swp{from{transform:translateX(0)}to{transform:translateX(20px)}}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;background:var(--fill2);font-size:15px;font-weight:600;color:rgba(235,235,245,.85);transition:transform .35s var(--spring),background .2s,color .2s}
.chip:active{transform:scale(.93)}
.chip.on{background:var(--acc);color:#fff}
.chip.soft.on{background:var(--accS);color:var(--acc)}

/* anéis */
.rings{display:flex;align-items:center;gap:18px}
.rings svg{flex:0 0 132px;width:132px;height:132px}
.rings circle{fill:none;stroke-linecap:round}
.rg{transition:stroke-dashoffset 1.3s var(--ease)}
.leg{display:grid;gap:10px;flex:1}
.leg div span{display:block;font-size:13px;font-weight:600}
.leg div b{font-size:21px;font-weight:800;letter-spacing:-.03em}
.leg div b small{font-size:13px;color:var(--sec);font-weight:600;letter-spacing:0}

/* refeições */
.meal{display:flex;gap:14px;padding:16px 16px;position:relative}
.meal+.meal::before{content:"";position:absolute;top:0;left:56px;right:0;height:.5px;background:var(--sep)}
.ck{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--ter);display:flex;align-items:center;justify-content:center;margin-top:1px;transition:transform .4s var(--spring),background .25s,border-color .25s}
.ck:active{transform:scale(.85)}
.ck.on{background:var(--green);border-color:var(--green)}
.ck.on::after{content:"";width:11px;height:6px;border-left:2.5px solid #000;border-bottom:2.5px solid #000;transform:rotate(-45deg) translate(1px,-1px)}
.ck.pop{animation:pop .5s var(--spring)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
.meal .hr{font-family:var(--mono);font-size:13px;color:var(--acc);font-weight:600}
.meal .mn{font-weight:700;font-size:17px;letter-spacing:-.02em}
.meal ul{list-style:none;margin-top:6px}
.meal li{font-size:15px;padding:2px 0;color:rgba(235,235,245,.88)}
.meal li em{font-style:normal;color:var(--sec)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--accS);color:var(--acc)}
.badge.g{background:rgba(48,209,88,.16);color:var(--green)}
.badge.o{background:rgba(255,159,10,.16);color:var(--orange)}
.badge.r{background:rgba(255,69,58,.16);color:var(--red)}

/* barras */
.bar{height:8px;background:var(--fill2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width .9s var(--ease)}
.stat{border-radius:18px;padding:14px}
.stat span{display:block;font-size:13px;color:var(--sec);font-weight:600}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.03em;margin-top:2px}

/* dias */
.days{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 14px;padding:2px 18px 6px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.days button{flex:0 0 auto;min-width:52px;padding:9px 6px;border-radius:16px;background:var(--fill2);text-align:center;transition:transform .4s var(--spring),background .2s}
.days button:active{transform:scale(.92)}
.days button span{display:block;font-size:12px;color:var(--sec);font-weight:600}
.days button b{display:block;font-size:18px;font-weight:700}
.days button.on{background:var(--acc)}
.days button.on span{color:rgba(255,255,255,.8)}
.days button.today:not(.on){box-shadow:inset 0 0 0 1.5px var(--acc)}

/* exercícios */
.ex{padding:16px;position:relative}
.ex+.ex::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.ex .top{display:flex;gap:12px;align-items:center}
.thumb{flex:0 0 64px;height:64px;border-radius:16px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb svg{width:60px;height:60px}
.ex .nm{font-weight:700;font-size:16.5px;letter-spacing:-.02em}
.ex .rx{font-family:var(--mono);font-size:13.5px;color:var(--acc);margin-top:3px;font-weight:600}
.sets{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sets button{width:44px;height:44px;border-radius:14px;background:var(--fill2);font-weight:700;font-size:15px;color:var(--sec);transition:transform .4s var(--spring),background .2s,color .2s}
.sets button:active{transform:scale(.88)}
.sets button.on{background:var(--green);color:#000}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini input{padding:10px 12px;font-size:16px}
.note{font-size:13.5px;color:var(--sec);margin-top:6px}
.ok{color:var(--green)}

/* figura animada */
.fig{width:100%;max-width:300px;margin:0 auto;display:block;aspect-ratio:1}
.figbox{border-radius:24px;background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--acc) 25%,transparent),transparent 70%),rgba(255,255,255,.04);padding:8px;margin:8px 0 16px}

/* alertas */
.alert{border-radius:18px;padding:13px 15px;font-size:14.5px;margin-bottom:12px;background:rgba(255,159,10,.12);color:#FFD9A0}
.alert.bad{background:rgba(255,69,58,.13);color:#FFC2BD}
.alert.info{background:var(--accS);color:var(--tx)}

/* folha (sheet) */
#sheet{position:fixed;inset:0;z-index:60;pointer-events:none}
#sheet .bd{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .35s}
#sheet .panel{position:absolute;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;margin:0 auto;max-width:600px;border-radius:30px 30px 0 0;padding:10px 18px calc(28px + var(--sab));transform:translateY(105%);transition:transform .55s var(--spring);background:rgba(28,28,32,.82);-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);border-top:.5px solid var(--glassB)}
#sheet.open{pointer-events:auto}
#sheet.open .bd{opacity:1}
#sheet.open .panel{transform:none;visibility:visible;transition:transform .55s var(--spring),visibility 0s}
#sheet:not(.open) .panel{visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s}
.grab{width:40px;height:5px;border-radius:9px;background:var(--ter);margin:0 auto 14px}

/* timer */
#timer{position:fixed;left:0;right:0;bottom:calc(92px + var(--sab));z-index:40;display:flex;justify-content:center;pointer-events:none;transform:translateY(30px) scale(.9);opacity:0;transition:transform .55s var(--spring),opacity .3s}
#timer.on{transform:none;opacity:1}
#timer .tp{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:999px;width:min(94vw,460px);background:rgba(30,30,34,.72)}
#timer .tp svg{flex:0 0 44px;width:44px;height:44px}
#timer .tl{flex:1;min-width:0}
#timer .tl span{display:block;font-size:12.5px;font-weight:600;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer .tl b{font-family:var(--mono);font-size:24px;font-weight:700;letter-spacing:-.02em}
#timer.alarm .tp{animation:alarm .6s ease-in-out 3}
@keyframes alarm{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--acc) 55%,transparent)}}
.tbig{font-family:var(--mono);font-size:64px;font-weight:700;letter-spacing:-.04em;text-align:center}

/* banner (lembrete de água) */
#banner{position:fixed;top:calc(8px + var(--sat));left:0;right:0;z-index:70;display:flex;justify-content:center;pointer-events:none;transform:translateY(-140%);transition:transform .6s var(--spring)}
#banner.on{transform:none}
#banner .bn{pointer-events:auto;width:min(94vw,460px);border-radius:24px;padding:14px 16px;display:flex;gap:12px;align-items:center;background:rgba(30,30,34,.8)}

/* calendário */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dw{font-size:12px;color:var(--sec);font-weight:600;padding-bottom:4px}
.cal button{position:relative;aspect-ratio:1;border-radius:50%;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;transition:transform .35s var(--spring)}
.cal button:active{transform:scale(.88)}
.cal button.fut{color:var(--ter)}
.cal button.today{box-shadow:inset 0 0 0 2px var(--acc)}
.cal button .dot{position:absolute;bottom:3px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--green)}
.cal button .wd{position:absolute;top:3px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--orange)}

/* gauge */
.gauge{position:relative;height:12px;border-radius:99px;background:linear-gradient(90deg,#64D2FF 0 18%,#30D158 18% 44%,#FFD60A 44% 62%,#FF9F0A 62% 80%,#FF453A 80%);margin:14px 0 6px}
.gauge i{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.4);transition:left 1s var(--spring)}
.gl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sec)}

.water{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.water i{width:20px;height:28px;border-radius:5px 5px 9px 9px;background:var(--fill2);display:block;transition:background .3s,transform .4s var(--spring)}
.water i.f{background:linear-gradient(180deg,#64D2FF,#0A84FF)}
.toast{position:fixed;left:50%;top:calc(64px + var(--sat));transform:translateX(-50%);padding:11px 18px;border-radius:999px;font-size:15px;font-weight:600;z-index:80;animation:tst 2.2s var(--spring) both}
@keyframes tst{0%{opacity:0;transform:translate(-50%,-20px) scale(.9)}12%{opacity:1;transform:translate(-50%,0) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-10px)}}
.gate{min-height:90vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate .box{max-width:400px;width:100%}
.logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#0A84FF,#FF6B8B);display:flex;align-items:center;justify-content:center;margin-bottom:20px;box-shadow:0 16px 40px rgba(10,132,255,.35)}
.logo svg{width:38px;height:38px}
body.gated #top,body.gated #tabs{display:none}
body.gated main{padding-top:var(--sat)}
.empty{text-align:center;padding:26px 12px;color:var(--sec)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:13px;font-weight:600;color:var(--sec);margin:0 0 6px 4px}
.secT{font-size:13px;color:var(--sec);text-transform:uppercase;letter-spacing:.03em;margin:22px 0 8px 16px;font-weight:500}
.foot{font-size:13px;color:var(--sec);margin:-6px 16px 14px}
footer.cred{text-align:center;color:var(--ter);font-size:12.5px;padding:18px 0 4px}
details.gs{border-radius:20px;margin-bottom:10px}
details.gs summary{list-style:none;padding:16px 18px;font-weight:700;display:flex;justify-content:space-between;cursor:pointer}
details.gs summary::-webkit-details-marker{display:none}
details.gs summary::after{content:"›";color:var(--ter);font-size:22px;line-height:1;transform:rotate(90deg);transition:transform .35s var(--spring)}

details.gs ul{margin-left:18px}details.gs li{margin:6px 0}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:110px;margin-top:12px}
.wk div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.wk i{display:block;width:100%;max-width:26px;border-radius:8px;background:linear-gradient(180deg,var(--acc),var(--acc2));transition:height 1s var(--spring)}
.wk i.z{background:var(--fill2)}
.wk span{font-size:12px;color:var(--sec);font-weight:600}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

async function sha(txt) {
  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
  catch (e) { return "h" + hashN(txt) + "_" + hashN(txt + "planoemcasa"); }
}

/* ===================== cálculos (motor de metas) ===================== */
function calc(p) {
  const peso = +p.peso, alt = +p.altura, idade = +p.idade, sexo = p.sexo;
  if (!peso || !alt || !idade) return null;
  const h = alt / 100, imc = peso / (h * h), rca = p.cintura ? +p.cintura / alt : null;
  const tmb = 10 * peso + 6.25 * alt - 5 * idade + (sexo === "M" ? 5 : -161);   // Mifflin-St Jeor
  const nDias = (p.dias || []).length;
  const fat = clamp(({sentado:1.2, misto:1.3, ativo:1.45}[p.trabalho] || 1.2) + 0.035 * nDias + (p.externo && (p.externo.sab || p.externo.dom) ? 0.02 : 0), 1.2, 1.8);
  const get = tmb * fat;
  const alertas = [];
  let def = {leve:300, moderado:500, acelerado:700}[p.ritmo] || 500;
  if (p.objetivo === "recomp") def = Math.min(def, 300);
  const piso = sexo === "M" ? 1500 : 1200;
  let semDeficit = false;
  if (p.saude && p.saude.gestante) { semDeficit = true; alertas.push({t:"bad", m:"Gestação ou amamentação: o app não aplica déficit calórico. Plano alimentar e treino precisam ser definidos com seu médico e nutricionista."}); }
  if (imc < 18.5) { semDeficit = true; alertas.push({t:"bad", m:"IMC abaixo de 18,5: o app não sugere perda de peso. Procure um profissional de saúde."}); }
  else if (imc < 23 && def > 300) { def = 300; alertas.push({t:"warn", m:"IMC próximo do adequado: o déficit foi limitado a 300 kcal e o foco passa a ser composição corporal."}); }
  if (idade < 18) alertas.push({t:"bad", m:"Menores de 18 anos devem seguir orientação de pediatra e nutricionista."});
  let meta = semDeficit ? get : Math.max(get - def, piso, tmb * 0.95);
  if (!semDeficit && get - def < piso) alertas.push({t:"warn", m:`A meta foi ajustada para não ficar abaixo de ${fmt(piso)} kcal, o piso de segurança usado pelas diretrizes para ${sexo === "M" ? "homens" : "mulheres"}.`});
  meta = Math.round(meta / 10) * 10;
  // proteína: peso de referência ajustado quando IMC > 25
  const pIdeal = 25 * h * h; const ref = imc > 25 ? pIdeal + 0.4 * (peso - pIdeal) : peso;

  const fib = Math.max(25, Math.round(meta / 1000 * 14));
  const agua = Math.round(clamp(peso * 32, 1800, 3500) / 50) * 50;
  let carbG, gordG;
  if (p.estilo === "lowcarb") { carbG = clamp(Math.round(meta * 0.22 / 4), 80, 130); gordG = Math.round((meta - prot * 4 - carbG * 4) / 9); }
  else { gordG = Math.round(meta * 0.28 / 9); carbG = Math.round((meta - prot * 4 - gordG * 9) / 4); }
  const ritmoKg = semDeficit ? 0 : (get - meta) * 7 / 7700;
  if (p.saude && p.saude.diabetes && p.saude.insulina) alertas.push({t:"warn", m:"Uso de insulina ou sulfonilureia: déficit e exercício aumentam o risco de hipoglicemia. Ajuste as doses com seu médico e monitore a glicemia."});
  if (p.estilo === "jejum" && p.tirz && p.tirz.ativo) alertas.push({t:"warn", m:"Jejum intermitente foi desativado porque o módulo de tirzepatida está ligado (dificulta atingir proteína e líquidos)."});
  if (p.estilo === "jejum" && p.saude && p.saude.diabetes && p.saude.insulina) alertas.push({t:"warn", m:"Jejum com insulina ou sulfonilureia só com supervisão médica. O app usou janela ampla."});

}

function plural(s) { if (/^porção/.test(s)) return s.replace("porção", "porções"); if (/^copo/.test(s)) return s.replace("copo", "copos"); return s.replace(/^([^\s(]+)/, w => /[oaeç]$/.test(w) ? w + "s" : w); }

function mealSlots(p) {
  const tirz = p.tirz && p.tirz.ativo;
  let n = clamp(+p.refeicoes || 5, 3, 6);
  const jejum = p.estilo === "jejum" && !tirz && !(p.saude && p.saude.insulina);
  if (tirz) n = Math.max(n, 5);
  if (jejum) n = Math.min(n, 4);
  let start = toMin(p.acorda) + (p.cafe === false ? 180 : 30), end = toMin(p.dorme) - 150;
  if (end <= start) end += 1440;
  if (jejum) start = Math.max(start, end - 600);
  const types = {3:["cafe","almoco","jantar"], 4:["cafe","almoco","lanche","jantar"], 5:["cafe","lanche","almoco","lanche","jantar"], 6:["cafe","lanche","almoco","lanche","jantar","ceia"]}[n];

function buildMeal(p, slot, K, P, seed, flags) {

  if (slot.tipo === "almoco" || slot.tipo === "jantar") {

    const carb = pick(pool(p, "carb"), seed >> 3);

    if (low) {
      const g = clamp(r * 0.45 / (carb.k / 100), 0, 80); if (g >= carb.un.g * 0.5) add(item(carb, g));
      r = K - sum("k");
      if (r > 90) { const ab = pool(p, "gord").find(f => f.id === "abacate"); add(ab ? item(ab, clamp(r * .6 / .96, 30, 90)) : item(FOODMAP.azeite, 5)); }
    }

    let cands = pool(p, "cprot");
    if (slot.tipo === "lanche") cands = cands.filter(f => f.id !== "frango_s" && f.id !== "leite") .concat([]);

}

function itemExact(f, g) { const m = g / 100; return {id:f.id, n:f.n, g, k:f.k * m, p:f.p * m, c:f.c * m, f:f.f * m, txt:qtyTxt(f, g)}; }
function serial(its) { return its.map(x => (x.id === "veg" || x.id === "livre" || !FOODMAP[x.id]) ? Object.assign({}, x) : {id:x.id, g:x.g}); }
function rebuild(its) { return (its || []).map(x => (x.id === "veg" || x.id === "livre" || !FOODMAP[x.id]) ? x : itemExact(FOODMAP[x.id], x.g)); }
function dayPlan(pid, date, opt) {
  opt = opt || {};

  const slots = mealSlots(p);
  const key = dkey(date), dow = date.getDay();
  const dl = getDay(pid, key);
  const vars = dl.var || {}; const esc = Object.assign({}, dl.esc || {});
  if (opt.exclude != null) delete esc[opt.exclude];
  const tirz = p.tirz && p.tirz.ativo;
  const pastosa = tirz && (dow === +p.tirz.dia || dow === (+p.tirz.dia + 1) % 7);
  const wk = Math.floor(date.getTime() / 6048e5);

  const anyFix = Object.keys(fixed).length > 0;

    const baseK = c.meta * s.fk, baseP = c.prot * s.fp;

    const t = m.itens.reduce((a, x) => ({k:a.k + x.k, p:a.p + x.p, c:a.c + x.c}), {k:0, p:0, c:0});
    return {...s, ...m, tot:t, idx:i, alvoK:K, alvoP:P, ajust:anyFix && !fixed[i] && Math.abs(K - baseK) / baseK > 0.08};

  return {meals, tot, pastosa, c, over:tot.k - c.meta};
}

const TPL = {

  FB:{n:"Corpo todo B", s:["quadril","emp_v","unil","puxar_h","core","triceps","pant"]},
  FC:{n:"Corpo todo C", s:["unil","emp_h","gluteo","puxar_v","core","biceps","triceps"]},
  IA:{n:"Inferiores A · joelho", s:["joelho","unil","gluteo","quadril","core","pant","core"]},
  IB:{n:"Inferiores B · quadril", s:["quadril","gluteo","unil","joelho","core","gluteo","core"]},
  SA:{n:"Superiores A", s:["emp_h","puxar_h","emp_v","puxar_v","biceps","triceps","core"]},
  SB:{n:"Superiores B", s:["puxar_h","emp_h","ombro","puxar_h","triceps","biceps","core"]},
  CD:{n:"Condicionamento + core", s:["cond","core","gluteo","cond","core"], cond:true},

function semana(p, date) { const ini = parseD(p.inicio || dkey(new Date())); return Math.max(1, Math.floor((date - ini) / 6048e5) + 1); }
function fase(w) {
  const c = ((w - 1) % 12) + 1;

  if (c <= 6) return {n:"Construção", d:"Volume completo. Termine cada série com 2 repetições sobrando e anote as cargas.", sets:0, rpe:"PSE 7/10", c};
  if (c <= 10) return {n:"Progressão", d:"Descida em 3 segundos nos exercícios principais e +1 série no primeiro exercício.", sets:0, extra:true, tempo:true, rpe:"PSE 7–8/10", c};
  if (c === 11) return {n:"Pico", d:"Semana mais exigente: busque bater suas melhores marcas com boa técnica.", sets:0, extra:true, rpe:"PSE 8/10", c};
  return {n:"Semana leve", d:"Recuperação planejada: uma série a menos em tudo. Na próxima semana o ciclo recomeça com variações novas.", sets:-1, rpe:"PSE 5–6/10", c};
}
function nivelN(p) { return {ini:1, int:2, ava:3}[p.nivel] || 1; }
function exOk(p, e) {
  const q = p.equip || {}; const s = p.saude || {};
  for (const r of e.eq) { if (r === "peso") continue; if (r === "kit" && !q.kit) return false; if (r === "cadeira" && !q.cadeira) return false; if (r === "sofa" && !q.sofa) return false; }

}
function pickEx(p, pad, seed, used) {
  let c = EX.filter(e => e.pad === pad && exOk(p, e) && !used.includes(e.id));
  if (pad === "joelho" && p.saude && p.saude.joelho) c = c.filter(e => e.joelhoOk);
  if (!c.length) { const alt = {joelho:"gluteo", unil:"gluteo", quadril:"gluteo", emp_v:"ombro", puxar_v:"puxar_h", cond:"core", pant:"core", ombro:"puxar_h"}[pad]; if (alt) c = EX.filter(e => e.pad === alt && exOk(p, e) && !used.includes(e.id)); }
  if (!c.length) c = EX.filter(e => e.pad === "core" && exOk(p, e) && !used.includes(e.id));

}
function rx(p, e, f, first) {
  const n = nivelN(p);
  let sets = e.kind === "big" || e.kind === "uni" ? [3, 3, 4][n - 1] : e.kind === "core" ? [2, 3, 3][n - 1] : [2, 3, 3][n - 1];
  if (e.kind === "cond") sets = [3, 4, 5][n - 1];
  sets = Math.max(2, sets + f.sets + (f.extra && first ? 1 : 0));
  let reps = e.kind === "big" ? ["10–15", "8–12", "8–12"][n - 1] : e.kind === "uni" ? ["8–12 cada lado", "8–12 cada lado", "10–15 cada lado"][n - 1] : e.kind === "core" ? ["20–30 s", "30–45 s", "45–60 s"][n - 1] : e.kind === "cond" ? ["30 s", "40 s", "45 s"][n - 1] : "12–15";
  if (["dead_bug", "bird_dog"].includes(e.id)) reps = ["6–8 cada lado", "8–10 cada lado", "10–12 cada lado"][n - 1];
  if (e.id === "farmer") reps = "30–40 s";
  const rest = e.kind === "big" ? "60–90 s" : e.kind === "uni" ? "45–75 s" : e.kind === "cond" ? "20–30 s" : "30–60 s";
  return {sets, reps, rest, tempo:f.tempo && (e.kind === "big" || e.kind === "uni") ? "descida em 3 s" : ""};
}
function cargaSug(p, e) {
  if (e.eq.every(x => x !== "kit")) return "peso corporal";
  const F = p.sexo === "F", n = nivelN(p);
  const big = {F:["4–8 kg", "8–12 kg", "10–16 kg"], M:["8–12 kg", "12–18 kg", "16–20 kg"]};
  const mid = {F:["2–4 kg por halter", "4–6 kg por halter", "6–8 kg por halter"], M:["4–6 kg por halter", "6–9 kg por halter", "8–10 kg por halter"]};
  const sm = {F:["1–2 kg por halter", "2–4 kg por halter", "3–5 kg por halter"], M:["2–4 kg por halter", "4–6 kg por halter", "5–8 kg por halter"]};
  const k = F ? "F" : "M";
  if (["agach_barra", "terra_rom", "remada_curv", "supino_b", "rosca_b"].includes(e.id) || (["agach_goblet", "agach_sumo", "agach_cadeira", "ponte", "hip_thrust", "swing", "swing_c"].includes(e.id))) return (e.id === "rosca_b" ? sm : big)[k][n - 1] + (["agach_goblet","agach_sumo","agach_cadeira","swing","swing_c"].includes(e.id) ? " (1 halter ou kettlebell)" : "");

function bikeTxt(p, f, min, tipo) {

function weekWorkouts(pid, ref) {

  const dias = (p.dias || []).slice().sort((a, b) => a - b);

  for (let dow = 0; dow < 7; dow++) {
    const i = dias.indexOf(dow);
    const d = addD(ref, dow - ref.getDay());
    if (i >= 0) out.push(buildSession(p, split[i % split.length], d, pid));

function buildSession(p, tk, d, pid) {

function outdoor(p, dow, d) {

    return {tipo:"externo", nome:"Tiros ao ar livre", dow, date:d, itens:["Aquecimento: 10 min de caminhada acelerando aos poucos + 3 acelerações leves.", `${reps} tiros de ${dist} a ~80% do máximo (rápido, mas sem se jogar), voltando caminhando até recuperar o fôlego.`, "Volta à calma: 10 min de caminhada leve + alongamento de panturrilhas e coxas.", "Use tênis com amortecimento e piso plano. Dor articular é sinal para parar."]};
  }

  strengthTraining:"Musculação", traditionalStrengthTraining:"Musculação", functionalStrengthTraining:"Treino funcional", weightlifting:"Musculação", calisthenics:"Calistenia",
  highIntensityIntervalTraining:"HIIT", crossTraining:"Treino cruzado", elliptical:"Elíptico", yoga:"Yoga", pilates:"Pilates", stretching:"Alongamento", swimming:"Natação",
  swimmingPool:"Natação", dance:"Dança", dancing:"Dança", jumpRope:"Pular corda", stairClimbing:"Escada", other:"Exercício"};
async function hcSync(manual, ask) {
  if (!NATIVE || !CAP.Health) return;
  const pid = devOwner();
  if (!pid || !S.perfis[pid] || !S.perfis[pid].completo) { if (manual) toast("Defina no Perfil de quem é este celular"); return; }
  if (HC.busy) return; HC.busy = true; if (manual) render();
  try {
    const av = await CAP.Health.isAvailable();
    if (!av.available) { HC.err = "Health Connect não está disponível neste celular" + (av.reason ? " (" + av.reason + ")" : ""); if (manual) toast(HC.err); return; }
    const tipos = {read:["steps", "calories", "sleep", "workouts"]};
    let st = await CAP.Health.checkAuthorization(tipos);
    if ((st.readDenied || []).length && (ask || !HC.auth)) st = await CAP.Health.requestAuthorization(tipos);
    HC.auth = true; lsSet("pec_hc_auth", "1");
    const ok = new Set(st.readAuthorized || []);
    if (!ok.size) { HC.err = "Sem permissão para ler os dados. Toque em Permissões."; if (manual) toast(HC.err); return; }
    const fim = new Date(), dias = HC.last ? 4 : 30;
    const ini = new Date(fim.getFullYear(), fim.getMonth(), fim.getDate() - dias);
    const iso = d => d.toISOString(), acc = {}, day = k => (acc[k] = acc[k] || {});
    if (ok.has("steps")) { const r = await CAP.Health.queryAggregated({dataType:"steps", startDate:iso(ini), endDate:iso(fim), bucket:"day", aggregation:"sum"}); for (const x of r.samples || []) { const v = Math.round(x.value || 0); if (v > 0) day(dkey(new Date(x.startDate))).passosAll = v; } }
    if (ok.has("calories")) { try { const r = await CAP.Health.queryAggregated({dataType:"calories", startDate:iso(ini), endDate:iso(fim), bucket:"day", aggregation:"sum"}); for (const x of r.samples || []) { const v = Math.round(x.value || 0); if (v > 0) day(dkey(new Date(x.startDate))).kcalAtiva = v; } } catch (e) {} }
    if (ok.has("sleep")) {
      const r = await CAP.Health.readSamples({dataType:"sleep", startDate:iso(addD(ini, -1)), endDate:iso(fim), limit:300, ascending:true}); const seen = new Set();
      for (const x of r.samples || []) {
        if (x.platformId && seen.has(x.platformId)) continue; if (x.platformId) seen.add(x.platformId);
        let min = x.stages && x.stages.length ? x.stages.filter(g => g.stage !== "awake" && g.stage !== "inBed").reduce((a, g) => a + (g.durationMinutes || 0), 0) : (x.value || (new Date(x.endDate) - new Date(x.startDate)) / 60000);
        if (min < 20 || min > 960) continue; const d = day(dkey(new Date(x.endDate))); d.sonoMin = (d.sonoMin || 0) + min;
      }
    }
    if (ok.has("workouts")) {
      let anchor, n = 0;
      do { const r = await CAP.Health.queryWorkouts({startDate:iso(ini), endDate:iso(fim), limit:100, ascending:true, anchor});
        for (const w of r.workouts || []) { const min = Math.round((w.duration || 0) / 60); if (min < 3) continue; const d = day(dkey(new Date(w.startDate))); d.ex = d.ex || [];
          d.ex.push({t:HC_TIPOS[w.workoutType] || "Exercício", min, kcal:w.totalEnergyBurned ? Math.round(w.totalEnergyBurned) : null, km:w.totalDistance ? Math.round(w.totalDistance / 100) / 10 : null}); }
        anchor = r.anchor; n++; } while (anchor && n < 5);
    }
    const res = applyRel(pid, acc, "healthconnect");
    const pp = clone(S.perfis[pid]); pp.cfg = Object.assign({}, pp.cfg || {}, {ultimoImport:new Date().toISOString()}); save("perfis/" + pid, pp);
    HC.last = Date.now(); lsSet("pec_hc_last", HC.last); HC.err = "";
    if (manual) toast(res.dias ? `Relógio atualizado: ${res.dias} ${res.dias > 1 ? "dias" : "dia"}` : "Relógio já estava atualizado");
  } catch (e) { HC.err = String((e && e.message) || e); if (manual) toast("Health Connect: " + HC.err); }
  finally { HC.busy = false; render(); }
}

async function nWaterSchedule(force) {

    const pend = await ln.getPending(); const old = (pend.notifications || []).filter(n => n.id >= 100 && n.id < 200).map(n => ({id:n.id}));

}
let nwT = null; function nWaterSoon() { if (!NATIVE) return; clearTimeout(nwT); nwT = setTimeout(() => nWaterSchedule(), 2500); }
function nTimerCancel() { const ln = CAP.LocalNotifications; if (!NATIVE || !ln) return; ln.cancel({notifications:Array.from({length:60}, (_, i) => ({id:300 + i}))}).catch(() => {}); }
function nTimerSchedule() {
  const ln = CAP.LocalNotifications; if (!NATIVE || !ln || !T.ph || T.paused || !NB.bg) return;
  nTimerCancel(); let t = T.end; const list = [];
  for (let i = T.i; i < T.ph.length && list.length < 60; i++) {

    if (t > Date.now()) list.push({id:300 + list.length, title:nx ? `${T.ph[i].l.split(" ·")[0]} terminou` : (T.name.startsWith("Descanso") ? "Descanso acabou" : "Timer concluído"), body:nx ? "Agora: " + nx.l : (T.name.startsWith("Descanso") ? "Bora para a próxima série!" : "Bom trabalho!"), channelId:"timer", smallIcon:"ic_stat_icon", iconColor:"#0A84FF", schedule:{at:new Date(t), allowWhileIdle:true}});

const SY = {busy:false, last:+(lsGet("pec_sy_last") || 0), ok:0, err:"", out:(() => { try { return JSON.parse(lsGet("pec_outbox") || "{}"); } catch (e) { return {}; } })()};
function syCfg() { try { const c = JSON.parse(lsGet("pec_sync") || "null"); return c && c.u ? c : null; } catch (e) { return null; } }
function syncPush(path, data) { if (!NATIVE) return; SY.out[path] = {data, t:S.ts[path] || Date.now()}; lsSet("pec_outbox", JSON.stringify(SY.out)); clearTimeout(SY.pt); SY.pt = setTimeout(() => syncAll(true), 1500); }
async function syncFlush(c) {
  const items = Object.entries(SY.out); if (!items.length) return;
  const r = await fetch(c.u, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify({k:c.k, op:"put", docs:items.map(([path, v]) => ({path, data:v.data, t:v.t}))})});
  const j = await r.json(); if (!j.ok) throw new Error(j.error || "erro ao enviar");
  for (const [path, v] of items) if (SY.out[path] && SY.out[path].t === v.t) delete SY.out[path];
  lsSet("pec_outbox", JSON.stringify(SY.out));
}
async function syncPull(c) {
  const r = await fetch(c.u + "?k=" + encodeURIComponent(c.k || "") + "&since=" + Math.max(0, SY.last - 600000));
  const j = await r.json(); if (!j.ok) throw new Error(j.error || "erro ao receber");
  let ch = false, mx = SY.last;
  for (const d of j.docs || []) { mx = Math.max(mx, d.t || 0); if (SY.out[d.path]) continue; if ((S.ts[d.path] || 0) < d.t) { applyLocal(d.path, d.data); S.ts[d.path] = d.t; ch = true; } }
  SY.last = mx; lsSet("pec_sy_last", mx); if (ch) persistLocal(); return ch;
}
async function syncAll(quiet) {
  const c = syCfg(); if (!NATIVE || !c || SY.busy) return; SY.busy = true;
  try { await syncFlush(c); const ch = await syncPull(c); SY.ok = Date.now(); SY.err = ""; if (ch) { render(); nWaterSoon(); } }
  catch (e) { SY.err = String((e && e.message) || e); }
  finally { SY.busy = false; if (!quiet && UI.view === "perfil") render(); }
}

async function importBackup(file) {
  try {
    const o = JSON.parse(await file.text()); if (!o || !o.perfis) throw new Error("arquivo inválido");
    let n = 0;
    for (const [id, d] of Object.entries(o.perfis || {})) if (d && PROFILES[id]) { save("perfis/" + id, d); n++; }
    for (const [id, d] of Object.entries(o.reg || {})) if (d && /^(dani|una)_\d{4}-\d{2}$/.test(id)) { const cur = S.reg[id]; const m = cur ? Object.assign({}, d, {dias:Object.assign({}, d.dias || {}, cur.dias || {})}) : d; save("registros/" + id, m); n++; }
    for (const [id, d] of Object.entries(o.cargas || {})) if (d && PROFILES[id]) { save("cargas/" + id, Object.assign({}, d, S.cargas[id] || {})); n++; }
    toast(`Backup importado (${n} itens)`); UI.editing = null; render(); nWaterSoon();
  } catch (e) { toast("Não consegui ler o backup: " + ((e && e.message) || e)); }
}

const APPS_SCRIPT = `// Plano em Casa · sincronização entre os celulares
// 1) Cole este código em Extensões › Apps Script da planilha

// 3) Implantar › Nova implantação › App da Web
//    Executar como: Eu · Quem pode acessar: Qualquer pessoa
const CHAVE = 'troque-esta-chave';

function aba_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName('docs');
  if (!sh) { sh = ss.insertSheet('docs'); sh.appendRow(['path', 'json', 't']); }
  return sh;
}
function resp_(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }

function doGet(e) {
  if ((e.parameter.k || '') !== CHAVE) return resp_({ok: false, error: 'chave inválida'});
  const since = Number(e.parameter.since || 0);
  const rows = aba_().getDataRange().getValues().slice(1);
  const docs = rows.filter(r => Number(r[2]) > since).map(r => ({path: r[0], data: JSON.parse(r[1]), t: Number(r[2])}));
  return resp_({ok: true, now: Date.now(), docs});
}

function doPost(e) {
  const b = JSON.parse(e.postData.contents || '{}');
  if ((b.k || '') !== CHAVE) return resp_({ok: false, error: 'chave inválida'});
  const lock = LockService.getScriptLock(); lock.waitLock(20000);
  try {
    const sh = aba_(), vals = sh.getDataRange().getValues(), idx = {};
    vals.forEach((r, i) => { if (i) idx[r[0]] = i + 1; });
    (b.docs || []).forEach(d => {
      const row = [d.path, JSON.stringify(d.data), Number(d.t) || Date.now()];
      const at = idx[d.path];
      if (at) { if (Number(sh.getRange(at, 3).getValue()) <= row[2]) sh.getRange(at, 1, 1, 3).setValues([row]); }
      else { sh.appendRow(row); idx[d.path] = sh.getLastRow(); }
    });
    return resp_({ok: true});
  } finally { lock.releaseLock(); }
}`;

    case "fdia": { const s = new Set(UI.editing.d.dias || []); s.has(+v) ? s.delete(+v) : s.add(+v); UI.editing.d.dias = [...s]; render(); break; }
    case "sair": lsDel("planoemcasa_ok"); UI.unlocked = false; timerStop(); render(); break;
    case "trocarSenha": openSheet(`<form id="pwForm"><div class="lt" style="font-size:28px">Trocar a senha</div><p class="sub">A nova senha vale para os dois perfis.</p><div class="fld mt16"><label>Nova senha</label><input type="password" id="np1" required></div><div class="fld"><label>Repita</label><input type="password" id="np2" required></div><div id="pwErr"></div><button class="btn pri block" type="submit">Salvar</button><button type="button" class="btn block mt8" data-a="closeSheet">Cancelar</button></form>`); break;
  }
});
document.addEventListener("submit", async ev => {
  if (ev.target.id === "pf") return submitForm(ev);
  if (ev.target.id === "pwForm") { ev.preventDefault(); const a = $("#np1").value, b = $("#np2").value; if (a.length < 4 || a !== b) { $("#pwErr").innerHTML = `<div class="alert bad">Use 4+ caracteres e repita igual.</div>`; return; } const h = await sha("planoemcasa:" + a); save("app/config", Object.assign({}, S.config, {h})); lsSet("planoemcasa_ok", h); closeSheet(); toast("Senha alterada"); }
});
const inTimers = {};
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.id === "libQ") { const q = el.value.trim().toLowerCase(); document.querySelectorAll(".lib-r").forEach(r => r.style.display = !q || r.dataset.name.includes(q) ? "" : "none"); document.querySelectorAll(".lib-l").forEach(l => { const vis = [...l.children].some(c => c.style.display !== "none"); l.style.display = vis ? "" : "none"; l.previousElementSibling.style.display = vis ? "" : "none"; }); return; }
  if (el.dataset.in) {
    const tk = el.dataset.ex + el.dataset.in; clearTimeout(inTimers[tk]);
    inTimers[tk] = setTimeout(() => { const k = el.dataset.k, id = el.dataset.ex, dl = getDay(UI.pid, k), tr = clone(dl.treino) || {}; tr.ex = tr.ex || {}; const val = el.value.replace(",", "."); tr.ex[id] = Object.assign({}, tr.ex[id], {[el.dataset.in]:val === "" ? null : +val}); setDay(UI.pid, k, {treino:tr}); }, 600);
  }
});
document.addEventListener("change", ev => { if (ev.target.id === "imF" && ev.target.files.length) importSH([...ev.target.files]); if (ev.target.id === "bkF" && ev.target.files.length) importBackup(ev.target.files[0]); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { timerTick(); waterCheck(); } });

render();
initStore();
setTimeout(waterCheck, 4000);

</script>
